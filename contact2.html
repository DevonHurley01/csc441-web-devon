<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Class 16: Step 1: my Contact 2 page-->
    <title>Contact Form Page - Devon Hurley</title>
    <!-- Class 12: Step 1: a typeface I chose -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="styles.css">
        <!-- Lab 15: Step 1: my third file-->
         <script src="script.js" defer></script>
        <!-- For fun: added a favicon for my website -->
            <link rel="icon" href="favicon/icon-192.png" type="image/x-icon">

</head>

<body>
        <!--Class 13: Step 2: navigation-->
    <nav>
        <ul>
            <!--Lab 13: Step 1: Show which page your on-->
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <!--Lab 13: Step 3: Show the contact page-->
            <li><a href="contact.html">Contact</a></li>
            <!-- Class 16: Step 1: the contact link-->
            <li><a href="contact2.html" class="current">Contact Form</a></li>
            <!-- Lab 15: Step 1: a theme button-->
            <li><button id="theme-toggle" type="button">Dark Mode</button></li>
        </ul>
    </nav>
    <!-- Class 11: step 2: the page -->
        <header>
            <!-- Class 12: Step 3: an image -->
            <img src="images/me.jpg" alt="Portrait of Devon Hurley" class="portrait">
            <!-- Lab 12: Task 1: group the text so it stacks beside the photo -->
            <div>
                <h1>Contact</h1>
                <p>Feel free to reach out to me about any questions or concerns!</p>
            </div>
        </header>

        <main>
            <div id="myform"style="display: none;">
                <!-- Class 16: Step 2: a form-->
            <form id="contact-form">
                <p>
                    <label for="name">Your name:</label>
                    <input id="name" name="name" type="text" required>
                </p>
                <p>
                    <label for="email">Your email:</label>
                    <input id="email" name="email" type="email" required>
                </p>
                <p>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>

                <button type="submit">Send</button>
            </form>

            </div>
           

            <p id="form-status" role="status"></p>
        </main>

        <!-- Lab 12: step 3: two things in the footer -->
        <footer>
            <!-- Lab 15: Step 1: the year, written by JavaScript-->
            <p>© <span id="year"></span> Devon Hurley</p>
            <p> </p>
            <!-- Lab 11 · Task 3: a link off my page -->
            <a href="https://github.com/DevonHurley01/csc441-web-devon.git" target="_blank" rel="noopener">GitHub</a>
            <!-- Lab 15: Step 5: a button to scroll to the top -->
            <button id="top-button" type="button">Top</button>
        </footer>

</body>

</html>
